version: 2

models:
  - name: fct_orders
    description: "Order grain fact table enriched with line item totals and payment reconciliations"
    columns:
      - name: order_id
        description: "Primary key for orders"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to customers"
        tests:
          - not_null

  - name: fct_daily_revenue
    description: "Daily aggregated financial reporting table"
    columns:
      - name: order_date
        description: "Date of business reporting"
        tests:
          - unique
          - not_null
