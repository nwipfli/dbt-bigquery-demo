version: 2

sources:
  - name: raw_ecommerce
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('DBT_DATASET_PREFIX', 'ecommerce') }}_raw"
    description: "Raw ingested e-commerce operational data populated by synthetic ingestion script"
    tables:
      - name: raw_customers
        description: "Raw customer registration records"
        config:
          loaded_at_field: signup_date
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 30, period: day}
        columns:
          - name: customer_id
            description: "Primary key for customers"
            tests:
              - unique
              - not_null
          - name: first_name
            description: "Synthetically generated customer first name (Faker mock data)"
            meta:
              is_synthetic: true
          - name: last_name
            description: "Synthetically generated customer last name (Faker mock data)"
            meta:
              is_synthetic: true
          - name: email
            description: "Synthetically generated mock customer email (RFC 2606 compliant @example.com)"
            meta:
              is_synthetic: true

      - name: raw_products
        description: "Raw product catalog data"
        config:
          loaded_at_field: created_at
          freshness:
            warn_after: {count: 730, period: day}
            error_after: {count: 1000, period: day}
        columns:
          - name: product_id
            description: "Primary key for products"
            tests:
              - unique
              - not_null

      - name: raw_orders
        description: "Raw transactional order headers"
        config:
          loaded_at_field: order_timestamp
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 7, period: day}
        columns:
          - name: order_id
            description: "Primary key for orders"
            tests:
              - unique
              - not_null

      - name: raw_order_items
        description: "Raw line item details per order"
        columns:
          - name: order_item_id
            description: "Primary key for order line items"
            tests:
              - unique
              - not_null

      - name: raw_payments
        description: "Raw payment transactions associated with orders"
        config:
          loaded_at_field: payment_timestamp
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 7, period: day}
        columns:
          - name: payment_id
            description: "Primary key for payments"
            tests:
              - unique
              - not_null
